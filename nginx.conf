server {
    listen 80;
    listen [::]:80;
    server_name _;
    
    # Redirección global a HTTPS (Descomentar en producción con SSL/TLS)
    # return 301 https://$host$request_uri;

    root /usr/share/nginx/html;
    index index.html;

    # Opciones de Compresión Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # CABECERAS DE SEGURIDAD STRICTAS (DEVSECOPS)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://wa.me https://*.wa.me; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;" ALWAYS;
    add_header X-Frame-Options "DENY" ALWAYS;
    add_header X-Content-Type-Options "nosniff" ALWAYS;
    add_header Referrer-Policy "strict-origin-when-cross-origin" ALWAYS;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" ALWAYS;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" ALWAYS;
    add_header X-XSS-Protection "1; mode=block" ALWAYS;

    # Ocultar versión de Nginx
    server_tokens off;

    # Manejo de enrutamiento SPA (Vite / React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché inmutable para archivos estáticos con hash
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Bloquear acceso a archivos ocultos (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
