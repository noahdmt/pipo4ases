# Zonas de Limitación de Tasa (Rate Limiting para mitigar DDoS y ataques por fuerza bruta)
# Se permiten máximo 10 peticiones por segundo por IP con una ráfaga (burst) controlada.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;
    
    # Redirección global a HTTPS (Descomentar en producción con SSL/TLS activo)
    # return 301 https://$host$request_uri;

    root /usr/share/nginx/html;
    index index.html;

    # Opciones de Compresión Gzip para optimizar ancho de banda
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # CABECERAS DE SEGURIDAD STRICTAS (DEVSECOPS)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://wa.me https://*.wa.me; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;" ALWAYS;
    add_header X-Frame-Options "DENY" ALWAYS;
    add_header X-Content-Type-Options "nosniff" ALWAYS;
    add_header Referrer-Policy "strict-origin-when-cross-origin" ALWAYS;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), display-capture=()" ALWAYS;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" ALWAYS;
    add_header X-XSS-Protection "1; mode=block" ALWAYS;

    # Ocultar la versión del servidor Nginx para evitar fingerprinting de vulnerabilidades
    server_tokens off;

    # Limitar el tamaño máximo de peticiones para prevenir saturación por buffer overflow (1MB máximo)
    client_max_body_size 1M;

    # Endpoint de comprobación de salud para monitoreo de Uptime y auto-reinicio de servicios
    location /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'healthy';
    }

    # Manejo de enrutamiento SPA (Vite / React Router) con Rate Limiting general
    location / {
        limit_req zone=general_limit burst=20 nodelay;
        try_files $uri $uri/ /index.html;
    }

    # Caché inmutable para archivos estáticos compilados con hash
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Bloquear acceso a archivos y carpetas ocultas sensibles (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
